name: Build & Publish NuGet (main branch)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-pack-publish:
    runs-on: windows-latest
    env:
      SOLUTION_PATH: TripleG3.P2P.slnx
      PROJECT_PATH: src/TripleG3.P2P/TripleG3.P2P.csproj
      UNIT_TEST_PROJECT: tests/TripleG3.P2P.UnitTests/TripleG3.P2P.UnitTests.csproj
      INTEGRATION_TEST_PROJECT: tests/TripleG3.P2P.IntegrationTests/TripleG3.P2P.IntegrationTests.csproj
      ARTIFACTS_PATH: artifacts
      TEST_RESULTS_PATH: TestResults
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:SOLUTION_PATH

      - name: Compute Version (no file modification)
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath $env:PROJECT_PATH
          $baseVersion = [Version]$project.Project.PropertyGroup.Version
          $version = "$($baseVersion.Major).$($baseVersion.Minor).$env:GITHUB_RUN_NUMBER"
          Write-Host "Resolved release package version: $version (base $baseVersion)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build package project (Release)
        shell: pwsh
        run: dotnet build $env:PROJECT_PATH -c Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false -p:IncludeSourceRevisionInInformationalVersion=false -p:Version=${{ steps.version.outputs.version }}

      - name: Build solution (Release)
        shell: pwsh
        run: dotnet build $env:SOLUTION_PATH -c Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false -p:IncludeSourceRevisionInInformationalVersion=false -p:Version=${{ steps.version.outputs.version }}

      - name: Unit test (Release)
        shell: pwsh
        run: dotnet test $env:UNIT_TEST_PROJECT -c Release --no-build --no-restore --logger "trx;LogFilePrefix=unit-release" --results-directory $env:TEST_RESULTS_PATH

      - name: Integration test (Release)
        shell: pwsh
        run: dotnet test $env:INTEGRATION_TEST_PROJECT -c Release --no-build --no-restore --logger "trx;LogFilePrefix=integration-release" --results-directory $env:TEST_RESULTS_PATH

      - name: Prepare package artifacts
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:ARTIFACTS_PATH) {
            Remove-Item -LiteralPath $env:ARTIFACTS_PATH -Recurse -Force
          }

          New-Item -ItemType Directory -Path $env:ARTIFACTS_PATH | Out-Null

      - name: Pack
        shell: pwsh
        run: dotnet pack $env:PROJECT_PATH -c Release --no-build --no-restore -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:ContinuousIntegrationBuild=true -p:GeneratePackageOnBuild=false -p:IncludeSourceRevisionInInformationalVersion=false -p:Version=${{ steps.version.outputs.version }} -o $env:ARTIFACTS_PATH

      - name: Validate package
        shell: pwsh
        run: ./eng/Validate-ReleasePackage.ps1 -PackageDirectory $env:ARTIFACTS_PATH -ExpectedVersion '${{ steps.version.outputs.version }}'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: ${{ env.TEST_RESULTS_PATH }}/*.trx

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-artifacts
          path: ${{ env.ARTIFACTS_PATH }}/*

      - name: Push to NuGet.org
        if: success() && env.NUGET_SOURCE == 'https://api.nuget.org/v3/index.json'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Warning 'NUGET_API_KEY secret not set; skipping push.'
            exit 0
          }

          $packages = @(Get-ChildItem -LiteralPath $env:ARTIFACTS_PATH -File -Filter '*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one package to publish, found $($packages.Count)."
          }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source $env:NUGET_SOURCE --skip-duplicate --no-symbols
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Get-ChildItem -LiteralPath $env:ARTIFACTS_PATH -File -Filter '*.snupkg' | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source $env:NUGET_SOURCE --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  # NOTE: GitHub release creation intentionally removed. This workflow's
  # sole responsibility is to build, pack and push packages to NuGet.org.